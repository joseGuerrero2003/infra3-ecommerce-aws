<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechShop — E-Commerce</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">TechShop</a>
      <ul class="navbar-nav">
        <li><a href="/">Catalog</a></li>
        <li class="nav-auth"><a href="/pages/login.html" class="btn btn-primary btn-sm">Login</a></li>
        <li class="nav-auth"><a href="/pages/register.html" class="btn btn-outline btn-sm">Register</a></li>
        <li class="nav-user" style="display:none;">
          <span style="font-size:0.875rem; color:var(--text-muted);">Hi, <strong class="nav-username"></strong></span>
        </li>
        <li class="nav-user cart-link" style="display:none;">
          <a href="/pages/cart.html" style="position:relative;">
            🛒 Cart
            <span class="cart-count cart-badge" style="display:none;">0</span>
          </a>
        </li>
        <li class="nav-user" style="display:none;"><a href="#" id="logout-btn">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Product Catalog</h1>
      <p class="page-subtitle">Find the best tech products at great prices</p>
    </div>

    <div id="alert-container"></div>

    <div class="filters-bar">
      <input type="text" id="search-input" class="filter-input" placeholder="Search products..." />
      <select id="category-select" class="filter-select">
        <option value="">All Categories</option>
        <option value="Electrónica">Electronics</option>
        <option value="Periféricos">Peripherals</option>
        <option value="Monitores">Monitors</option>
        <option value="Audio">Audio</option>
        <option value="Almacenamiento">Storage</option>
        <option value="Accesorios">Accessories</option>
        <option value="Componentes">Components</option>
        <option value="Redes">Networking</option>
        <option value="Mobiliario">Furniture</option>
      </select>
    </div>

    <div id="products-grid" class="products-grid">
      <div class="spinner"></div>
    </div>

    <div id="pagination" class="pagination"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
