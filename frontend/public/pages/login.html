<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — TechShop</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div id="alert-container"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Sign In</button>
      </form>

      <p style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
        Don't have an account? <a href="/pages/register.html" style="color:var(--primary);">Register</a>
      </p>
      <p style="text-align:center; margin-top:0.5rem; font-size:0.875rem;">
        <a href="/" style="color:var(--text-muted);">← Back to catalog</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
