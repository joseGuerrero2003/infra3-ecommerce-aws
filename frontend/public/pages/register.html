<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — TechShop</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join TechShop and start shopping</p>

      <div id="alert-container"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="yourname" required minlength="3" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 number" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repeat password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Create Account</button>
      </form>

      <p style="text-align:center; margin-top:1.25rem; font-size:0.875rem; color:var(--text-muted);">
        Already have an account? <a href="/pages/login.html" style="color:var(--primary);">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
