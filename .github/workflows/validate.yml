name: Validate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ecommerce_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_test
          DB_USER: dbadmin
          DB_PASSWORD: testpassword
          JWT_SECRET: test-jwt-secret-min-32-chars-long!!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars!!
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
        run: npm test

  validate-cloudformation:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: |
          cfn-lint cloudformation/network.yaml
          cfn-lint cloudformation/security.yaml
          cfn-lint cloudformation/database.yaml
          cfn-lint cloudformation/compute.yaml
          cfn-lint cloudformation/monitoring.yaml
        continue-on-error: true

      - name: Validate templates with AWS (dry-run)
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for f in cloudformation/network.yaml cloudformation/security.yaml \
                   cloudformation/database.yaml cloudformation/compute.yaml \
                   cloudformation/monitoring.yaml; do
            echo "Validating: $f"
            aws cloudformation validate-template --template-body file://$f
          done
