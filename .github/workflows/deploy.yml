name: Deploy

# Despliegue manual: las credenciales del sandbox de AWS Academy expiran,
# así que se ejecuta desde Actions > Deploy > Run workflow con una sesión activa.
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Test
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Validate CloudFormation templates
        run: |
          for t in cloudformation/*.yaml; do
            echo "Validating $t"
            aws cloudformation validate-template --template-body "file://$t" > /dev/null
          done

      - name: Deploy compute stack
        run: |
          aws cloudformation deploy \
            --stack-name ecommerce-dev-compute \
            --template-file cloudformation/compute.yaml \
            --parameter-overrides \
              Environment=dev \
              ProjectName=ecommerce \
              GitHubRepoUrl=${{ github.server_url }}/${{ github.repository }}.git \
              GitHubBranch=main \
              DBUsername=${{ secrets.DB_USERNAME }} \
              DBPassword=${{ secrets.DB_PASSWORD }} \
              DBName=ecommerce \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              JwtRefreshSecret=${{ secrets.JWT_REFRESH_SECRET }} \
              InstanceProfileName=${{ secrets.INSTANCE_PROFILE_NAME }} \
            --no-fail-on-empty-changeset

      - name: Rolling deploy (ASG instance refresh)
        run: |
          ASG_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='ecommerce-dev-AsgName'].Value" --output text)
          echo "ASG: $ASG_NAME"
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":600}' \
            --query InstanceRefreshId --output text)
          echo "Instance refresh: $REFRESH_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].[Status,PercentageComplete]' --output text)
            echo "[$i/60] $STATUS"
            case "$STATUS" in
              Successful*) exit 0 ;;
              Failed*|Cancelled*|RollbackSuccessful*|RollbackFailed*) exit 1 ;;
            esac
            sleep 30
          done
          echo "Timeout waiting for instance refresh"
          exit 1

      - name: Verify deployment
        run: |
          ALB_DNS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='ecommerce-dev-AlbDnsName'].Value" --output text)
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://$ALB_DNS/health" --max-time 10 || echo 0)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified! App is healthy at http://$ALB_DNS"
              exit 0
            fi
            echo "Attempt $i/20: status $STATUS, waiting 30s..."
            sleep 30
          done
          echo "Deployment verification failed"
          exit 1
