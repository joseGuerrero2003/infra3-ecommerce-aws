name: Deploy

# Despliegue manual: las credenciales del sandbox de AWS Academy expiran,
# así que se ejecuta desde Actions > Deploy > Run workflow con una sesión activa.
on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Test
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Validate CloudFormation templates
        run: |
          for t in cloudformation/*.yaml; do
            echo "Validating $t"
            aws cloudformation validate-template --template-body "file://$t" > /dev/null
          done

      - name: Deploy compute stack
        run: |
          aws cloudformation deploy \
            --stack-name ecommerce-dev-compute \
            --template-file cloudformation/compute.yaml \
            --parameter-overrides \
              Environment=dev \
              ProjectName=ecommerce \
              AppInstanceId=${{ secrets.APP_INSTANCE_ID }} \
            --no-fail-on-empty-changeset

      - name: Deploy application code (SSM Run Command)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.APP_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy ${{ github.sha }}" \
            --parameters 'commands=["bash /app/ecommerce/scripts/deploy.sh"]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.APP_INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.APP_INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ secrets.APP_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text | tail -30
          [ "$STATUS" = "Success" ]

      - name: Verify deployment
        run: |
          ALB_DNS=$(aws cloudformation list-exports \
            --query "Exports[?Name=='ecommerce-dev-AlbDnsName'].Value" \
            --output text)
          echo "Waiting for ALB health check..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "http://$ALB_DNS/health" --max-time 10 || echo 0)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment verified! App is healthy at http://$ALB_DNS"
              exit 0
            fi
            echo "Attempt $i/20: status $STATUS, waiting 30s..."
            sleep 30
          done
          echo "Deployment verification failed"
          exit 1
