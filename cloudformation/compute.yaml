AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECommerce Compute Stack - ALB + manual EC2 instance'

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: ecommerce
  AppInstanceId:
    Type: String
    Default: ''
    Description: 'ID de la instancia EC2 (opcional)'
  AppPort:
    Type: Number
    Default: 3000
  CreateBastionHost:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  BastionKeyName:
    Type: String
    Default: vockey
  LabInstanceProfileArn:
    Type: String
    Default: 'c203071a5182623l15328841t1w665714566988-SsmRoleInstanceProfile-E09LKNddhqyP'

Conditions:
  HasBastionHost: !Equals [!Ref CreateBastionHost, 'true']
  HasInstance: !Not [!Equals [!Ref AppInstanceId, '']]

Resources:

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetBId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgAlbId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb'
        - Key: Project
          Value: !Ref ProjectName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg'
      Port: !Ref AppPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-VpcId'
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-tg'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  BastionHost:
    Type: AWS::EC2::Instance
    Condition: HasBastionHost
    Properties:
      InstanceType: t2.micro
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !Ref LabInstanceProfileArn
      KeyName: !Ref BastionKeyName
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgBastionId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-bastion'
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf update -y
          echo "Bastion host ready" > /etc/motd

Outputs:
  AlbDnsName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbDnsName'

  AlbArn:
    Description: ALB ARN
    Value: !Ref ALB
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbArn'

  AppInstanceId:
    Description: App EC2 Instance ID
    Value: !If [HasInstance, !Ref AppInstanceId, 'none']
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AppInstanceId'

  BastionPublicIp:
    Description: Bastion Host Public IP
    Value: !If
      - HasBastionHost
      - !GetAtt BastionHost.PublicIp
      - 'N/A'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BastionPublicIp'

  AppUrl:
    Description: Application URL
    Value: !Sub 'http://${ALB.DNSName}'
