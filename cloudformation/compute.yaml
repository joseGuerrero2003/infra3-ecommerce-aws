AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECommerce Compute Stack - ALB + Launch Template + Auto Scaling Group (Multi-AZ) + Bastion'

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: ecommerce
  GitHubRepoUrl:
    Type: String
    Description: HTTPS URL of the application repository
  GitHubBranch:
    Type: String
    Default: main
  BastionKeyName:
    Type: String
    Default: vockey
  CreateBastionHost:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DBUsername:
    Type: String
    Default: dbadmin
  DBPassword:
    Type: String
    NoEcho: true
  DBName:
    Type: String
    Default: ecommerce
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  JwtRefreshSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AppPort:
    Type: Number
    Default: 3000
  NodeEnvironment:
    Type: String
    Default: production
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro, t2.small, t2.medium, t4g.micro]
    Description: 't3.micro es elegible para el plan gratuito actual; t2.micro ya no lo es en todas las regiones'
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: 'Existing instance profile for app instances (AWS Academy does not allow creating IAM roles)'
  AsgMinSize:
    Type: Number
    Default: 1
  AsgMaxSize:
    Type: Number
    Default: 3
  AsgDesiredSize:
    Type: Number
    Default: 2
    Description: '2 instances = one per Availability Zone'
  AppSubnetType:
    Type: String
    Default: private
    AllowedValues: [private, public]
    Description: "private = detrás de NAT Gateway (recomendado); public = sin NAT, el SG solo acepta tráfico del ALB"
  CpuTargetValue:
    Type: Number
    Default: 50
    Description: 'Target average CPU (%) for target tracking scaling'

Conditions:
  HasBastionHost: !Equals [!Ref CreateBastionHost, 'true']
  UsePublicSubnets: !Equals [!Ref AppSubnetType, 'public']

Resources:

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetBId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgAlbId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb'
        - Key: Project
          Value: !Ref ProjectName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg'
      Port: !Ref AppPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-VpcId'
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-tg'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-${Environment}-lt'
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-SgAppId'
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        UserData:
          Fn::Base64:
            !Sub |
              #!/bin/bash
              set -e
              exec > >(tee /var/log/userdata.log) 2>&1
              echo "=== ECommerce UserData Start ==="

              dnf update -y
              curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
              dnf install -y nodejs git nc
              npm install -g pm2
              dnf install -y amazon-cloudwatch-agent

              mkdir -p /app
              REPO_URL="${GitHubRepoUrl}"
              BRANCH="${GitHubBranch}"
              if [ -d "/app/ecommerce/.git" ]; then
                cd /app/ecommerce && git pull origin "$BRANCH"
              else
                git clone -b "$BRANCH" "$REPO_URL" /app/ecommerce
              fi

              cd /app/ecommerce/backend

              DB_HOST=$(aws ssm get-parameter \
                --name "/${ProjectName}/${Environment}/db/endpoint" \
                --query "Parameter.Value" --output text --region ${AWS::Region} 2>/dev/null || echo "localhost")

              cat > /app/ecommerce/backend/.env << ENVEOF
              NODE_ENV=${NodeEnvironment}
              PORT=${AppPort}
              DB_HOST=$DB_HOST
              DB_PORT=5432
              DB_NAME=${DBName}
              DB_USER=${DBUsername}
              DB_PASSWORD=${DBPassword}
              JWT_SECRET=${JwtSecret}
              JWT_EXPIRES_IN=15m
              JWT_REFRESH_SECRET=${JwtRefreshSecret}
              JWT_REFRESH_EXPIRES_IN=7d
              CORS_ORIGIN=*
              LOG_LEVEL=info
              AWS_REGION=${AWS::Region}
              CLOUDWATCH_LOG_GROUP=/ecommerce/app
              ENVEOF

              npm ci --production

              echo "Waiting for database at $DB_HOST:5432..."
              for i in $(seq 1 30); do
                if nc -z "$DB_HOST" 5432 2>/dev/null; then
                  echo "DB reachable"; break
                fi
                echo "Attempt $i/30 - waiting 10s..."
                sleep 10
              done

              npx sequelize-cli db:migrate --env production

              SEED_COUNT=$(node -e "require('dotenv').config(); const {Product}=require('./src/models'); Product.count().then(c=>{process.stdout.write(String(c));process.exit(0);}).catch(()=>{process.stdout.write('0');process.exit(0);})" 2>/dev/null || echo "0")
              if [ "$SEED_COUNT" = "0" ]; then
                echo "Seeding database..."
                npx sequelize-cli db:seed:all --env production
              else
                echo "DB already seeded ($SEED_COUNT products), skipping."
              fi

              mkdir -p /var/log/pm2
              pm2 start ecosystem.config.js --env production
              env PATH=$PATH:/usr/bin pm2 startup systemd -u ec2-user --hp /home/ec2-user | bash || true
              pm2 save

              cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWEOF'
              {
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {"file_path":"/var/log/pm2/ecommerce-out.log","log_group_name":"/ecommerce/app","log_stream_name":"{instance_id}/out"},
                        {"file_path":"/var/log/pm2/ecommerce-error.log","log_group_name":"/ecommerce/app","log_stream_name":"{instance_id}/error"},
                        {"file_path":"/var/log/userdata.log","log_group_name":"/ecommerce/system","log_stream_name":"{instance_id}/userdata"}
                      ]
                    }
                  }
                }
              }
              CWEOF

              systemctl start amazon-cloudwatch-agent
              systemctl enable amazon-cloudwatch-agent
              echo "=== ECommerce UserData Complete ==="
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${ProjectName}-${Environment}-app'
              - Key: Project
                Value: !Ref ProjectName
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: !Ref ProjectName

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: ALBListener
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-${Environment}-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredSize
      VPCZoneIdentifier: !If
        - UsePublicSubnets
        - - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetBId'
        - - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetAId'
          - !ImportValue
            Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetBId'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-asg-instance'
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT10M
        WaitOnResourceSignals: false

  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 600
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetValue

  BastionHost:
    Type: AWS::EC2::Instance
    Condition: HasBastionHost
    Properties:
      InstanceType: t2.micro
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref BastionKeyName
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgBastionId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-bastion'
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf update -y
          echo "Bastion host ready" > /etc/motd

Outputs:
  AlbDnsName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbDnsName'

  AlbArn:
    Description: ALB ARN
    Value: !Ref ALB
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbArn'

  TargetGroupArn:
    Description: ALB Target Group ARN
    Value: !Ref ALBTargetGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-TargetGroupArn'

  AsgName:
    Description: Auto Scaling Group Name
    Value: !Ref AppAutoScalingGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AsgName'

  BastionPublicIp:
    Description: Bastion Host Public IP (N/A if CreateBastionHost=false)
    Value: !If
      - HasBastionHost
      - !GetAtt BastionHost.PublicIp
      - 'N/A'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BastionPublicIp'

  AppUrl:
    Description: Application URL
    Value: !Sub 'http://${ALB.DNSName}'
