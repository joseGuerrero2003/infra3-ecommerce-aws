AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECommerce Compute Stack - ALB, App EC2 Instance'

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: ecommerce
  GitHubRepoUrl:
    Type: String
    Description: GitHub repository URL (https://github.com/user/repo.git)
  GitHubBranch:
    Type: String
    Default: main
  BastionKeyName:
    Type: String
    Default: vockey
    Description: EC2 Key Pair for Bastion SSH access (only if CreateBastionHost=true)
  CreateBastionHost:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'Set to true to deploy Bastion Host. Disable for AWS Academy.'
  DBUsername:
    Type: String
    Default: dbadmin
  DBPassword:
    Type: String
    NoEcho: true
  DBName:
    Type: String
    Default: ecommerce
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  JwtRefreshSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  AppPort:
    Type: Number
    Default: 3000
  NodeEnvironment:
    Type: String
    Default: production
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t2.small, t2.medium]
  LabInstanceProfileArn:
    Type: String
    Default: ''
    Description: 'AWS Academy: set to any non-empty value to use LabInstanceProfile by name'

Conditions:
  UseLabProfile: !Not [!Equals [!Ref LabInstanceProfileArn, '']]
  HasBastionHost: !Equals [!Ref CreateBastionHost, 'true']

Resources:

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetBId'
      SecurityGroups:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgAlbId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb'
        - Key: Project
          Value: !Ref ProjectName

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !If
        - UseLabProfile
        - !Ref LabInstanceProfileArn
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-EC2InstanceProfileArn'
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-PrivateSubnetAId'
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgAppId'
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash
            set -e
            exec > >(tee /var/log/userdata.log) 2>&1
            echo "=== ECommerce UserData Start ==="

            dnf update -y
            curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
            dnf install -y nodejs git nc
            npm install -g pm2
            dnf install -y amazon-cloudwatch-agent

            mkdir -p /app
            git clone -b "${GitHubBranch}" "${GitHubRepoUrl}" /app/ecommerce 2>/dev/null || \
              (cd /app/ecommerce && git pull origin "${GitHubBranch}")

            cd /app/ecommerce/backend

            DB_HOST=$(aws ssm get-parameter \
              --name "/${ProjectName}/${Environment}/db/endpoint" \
              --query "Parameter.Value" --output text --region us-east-1 2>/dev/null || echo "localhost")

            cat > /app/ecommerce/backend/.env <<ENVEOF
            NODE_ENV=${NodeEnvironment}
            PORT=${AppPort}
            DB_HOST=$DB_HOST
            DB_PORT=5432
            DB_NAME=${DBName}
            DB_USER=${DBUsername}
            DB_PASSWORD=${DBPassword}
            JWT_SECRET=${JwtSecret}
            JWT_EXPIRES_IN=15m
            JWT_REFRESH_SECRET=${JwtRefreshSecret}
            JWT_REFRESH_EXPIRES_IN=7d
            CORS_ORIGIN=*
            LOG_LEVEL=info
            AWS_REGION=us-east-1
            CLOUDWATCH_LOG_GROUP=/ecommerce/app
            ENVEOF

            npm ci --production

            echo "Waiting for DB at $DB_HOST:5432..."
            for i in $(seq 1 30); do
              if nc -z "$DB_HOST" 5432 2>/dev/null; then
                echo "DB reachable at $DB_HOST"; break
              fi
              echo "Attempt $i/30 - waiting 10s..."
              sleep 10
            done

            npx sequelize-cli db:migrate --env production

            SEED_COUNT=$(node -e "
            require('dotenv').config();
            const {Product}=require('./src/models');
            Product.count().then(c=>{process.stdout.write(String(c));process.exit(0);}).catch(()=>{process.stdout.write('0');process.exit(0);});
            " 2>/dev/null || echo "0")

            if [ "$SEED_COUNT" = "0" ]; then
              echo "Seeding database..."
              npx sequelize-cli db:seed:all --env production
            else
              echo "DB already seeded ($SEED_COUNT products), skipping."
            fi

            mkdir -p /var/log/pm2
            pm2 start ecosystem.config.js --env production
            env PATH=$PATH:/usr/bin pm2 startup systemd -u ec2-user --hp /home/ec2-user | bash || true
            pm2 save

            echo "=== ECommerce UserData Complete ==="
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-app'
        - Key: Project
          Value: !Ref ProjectName

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg'
      Port: !Ref AppPort
      Protocol: HTTP
      VpcId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-VpcId'
      TargetType: instance
      Targets:
        - Id: !Ref AppInstance
          Port: !Ref AppPort
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-tg'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  BastionHost:
    Type: AWS::EC2::Instance
    Condition: HasBastionHost
    Properties:
      InstanceType: t2.micro
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      IamInstanceProfile: !If
        - UseLabProfile
        - LabInstanceProfile
        - !Ref AWS::NoValue
      KeyName: !Ref BastionKeyName
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectName}-${Environment}-PublicSubnetAId'
      SecurityGroupIds:
        - !ImportValue
          Fn::Sub: '${ProjectName}-${Environment}-SgBastionId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-bastion'
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: |
          #!/bin/bash
          dnf update -y
          echo "Bastion host ready" > /etc/motd

Outputs:
  AlbDnsName:
    Description: Application Load Balancer DNS Name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbDnsName'

  AlbArn:
    Description: ALB ARN
    Value: !Ref ALB
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbArn'

  AppInstanceId:
    Description: App EC2 Instance ID
    Value: !Ref AppInstance
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AppInstanceId'

  BastionPublicIp:
    Description: Bastion Host Public IP (N/A if CreateBastionHost=false)
    Value: !If
      - HasBastionHost
      - !GetAtt BastionHost.PublicIp
      - 'N/A'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-BastionPublicIp'

  AppUrl:
    Description: Application URL
    Value: !Sub 'http://${ALB.DNSName}'
